# === 加密货币监控系统配置 ===

# 监控配置
monitor:
  # 监控的币种列表
  watch_list:
    - WIF
    - SOL
    - PEPE
    - BOME
    - BTC
  
  # 拉取间隔（秒）
  interval: 30
  
  # 波动阈值配置（多级阈值）
  thresholds:
    # 小波动提醒
    minor: 0.5
    # 中等波动警告
    moderate: 1.5
    # 大波动警报
    major: 3.0
  
  # 价格稳定期（秒）- 避免同一波段连环报警
  cooldown: 60
  # 组合规则：最小市值过滤，0 表示不启用
  min_market_cap_usd: 0
  # 组合规则：最小 24h 成交额过滤，0 表示不启用
  min_volume_24h_usd: 0

# 市场数据源配置
market:
  # 交易所API端点
  base_url: "http://${GCP_IP}/mexc/api/v3/ticker/price"
  # 请求超时（秒）
  timeout: 8
  # 重试次数
  max_retries: 3
  # 重试间隔（秒）
  retry_delay: 2

# Binance REST 数据源，AR 策略用；第一个地址可指向 Nginx 代理池
binance:
  base_urls:
    - "${BINANCE_BASE_URL}"
  timeout: 10
  max_retries: 3
  retry_delay: 1
  page_limit: 1000

# DEX 聚合数据源配置，当前实现支持 DexScreener
dex:
  enabled: true
  base_url: "${DEXSCREENER_BASE_URL}"
  chain_id: "solana"
  # 示例：填入代币合约地址后，系统会用 DexScreener 补充 DEX 价格/流动性/市值
  token_addresses: {}
  timeout: 8
  max_retries: 2
  retry_delay: 2

# 量化分析配置
quant:
  enabled: true
  history_hours: 72
  min_score_to_alert: 70

# AR/AO 五维自适应量化策略，当前默认只产出信号，不自动下单
ar_strategy:
  enabled: true
  symbol: "ARUSDT"
  weekly_interval: "1w"
  hourly_interval: "1h"
  ma_fast: 7
  ma_slow: 25
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_stddev: 2.0
  rsi_period: 14
  key_resistance: 2.645
  funding_rate_threshold: 0.0003
  step_in_slices: 3
  history_start_time_ms:

# AI服务配置
ai:
  provider: gemini
  model: gemini-1.5-flash
  base_url: "http://${GCP_IP}/gemini/v1beta/models"
  timeout: 15
  
  # AI提示词模板
  prompt_template: |
    你是经验丰富的 Web3 交易员。${symbol} 当前价格 ${price}，近期波动 ${change:.2f}%。
    波动级别：${level}。
    请用${style}的网感语境写一句点评，带 Emoji，50 字内。
    
    波动级别说明：
    - minor: 小波动，轻松调侃
    - moderate: 中等波动，严肃提醒
    - major: 大波动，紧急警报
    
    风格映射：
    - minor: 嘲讽或戏谑
    - moderate: 专业分析
    - major: 紧急或热血

# 通知配置
notification:
  telegram:
    enabled: true
    base_url: "http://${GCP_IP}/tg"
    timeout: 10
  
  # 通知限流（防止刷屏）
  rate_limit:
    # 每分钟最大通知数
    max_per_minute: 5
    # 相同币种最小间隔（秒），PRD 建议 10 分钟防刷屏
    min_interval: 600

# 交易返佣与 Deep Link 配置，默认关闭
affiliate:
  enabled: false
  referral_code: "${AFFILIATE_REFERRAL_CODE}"
  # 示例: "https://t.me/YourTradeBot?start={symbol}-{referral_code}"
  deep_link_template: "${AFFILIATE_DEEP_LINK_TEMPLATE}"
  free_mode: false
  mask_symbol: true

# 存储配置
storage:
  # 数据库类型：sqlite, redis
  type: sqlite
  # SQLite 数据库路径
  sqlite:
    path: "./data/crypto_monitor.db"
  
  # 历史数据保留天数
  history_retention_days: 30

# 日志配置
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # 日志文件配置
  file:
    enabled: true
    path: "./logs/crypto_monitor.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5
  # 控制台输出
  console:
    enabled: true
    colored: true

# 健康检查配置
health_check:
  enabled: true
  # 检查间隔（秒）
  interval: 300
  # 最大连续失败次数
  max_failures: 3
  # 失败后自动重启
  auto_restart: true

# 链上事件配置
onchain:
  enabled: true
  tracked_addresses: []
  whale_transfer_threshold_usd: 50000
  webhook_auth_token: "${ONCHAIN_WEBHOOK_TOKEN}"
  webhook_signature_secret: "${ONCHAIN_WEBHOOK_SECRET}"
  webhook_signature_header: "X-Webhook-Signature"
  max_clock_skew_seconds: 300

# 可配置规则，空列表时使用内置默认规则
rules:
  enabled: true
  market:
    - id: default-major-move
      enabled: true
      level: major
      tags: ["configured-rule", "price-momentum"]
      all:
        - price_change_abs_gte: 3
    - id: liquid-midcap-move
      enabled: false
      level: moderate
      tags: ["configured-rule", "liquid-market"]
      all:
        - price_change_abs_gte: 1.5
        - volume_24h_gte: 100000
  onchain:
    - id: whale-transfer
      enabled: true
      level: major
      tags: ["configured-rule", "whale-transfer"]
      all:
        - amount_usd_gte: 50000
    - id: new-pair-created
      enabled: true
      level: moderate
      tags: ["configured-rule", "new-pair"]
      all:
        - event_type_in: ["NewPairCreated"]

# 报告层配置
reporting:
  enabled: true
  output_dir: "./reports"
  default_lookback_hours: 24
  major_only: true
  auto_send: false
  daily_hour: 8

# 本地服务配置
service:
  host: "0.0.0.0"
  port: 28593
  # 可选：设置后，写操作需要 X-Admin-Token 或 ?admin_token=
  admin_token: "${SERVICE_ADMIN_TOKEN}"
